name: V3 Foundation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [v3-foundation]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required foundation files
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/migrations/20261110000000_v3_foundation.sql
          test -s docs/V3_FOUNDATION.md
          grep -q "enable row level security" supabase/migrations/20261110000000_v3_foundation.sql
          grep -q "create policy" supabase/migrations/20261110000000_v3_foundation.sql
          ! grep -R -E "sb_secret_[A-Za-z0-9_-]{10,}|service_role[=: ]+[A-Za-z0-9_-]{20,}" site supabase docs
          git diff --check
