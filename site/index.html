        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .safe-pb { padding-bottom: calc(4rem + env(safe-area-inset-bottom)); }
        .safe-pt { padding-top: max(0.75rem, env(safe-area-inset-top)); }
        .glass { background: rgba(26, 34, 48, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .light .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
        .aspect-9-16 { aspect-ratio: 9 / 16; }

        .demo-ribbon{margin:10px 14px 0;padding:9px 12px;border:1px solid rgba(25,199,199,.28);border-radius:12px;background:rgba(25,199,199,.08);font-size:11px;color:#9fe7e7;line-height:1.45}
        .video-credit{padding:8px 12px;font-size:10px;color:#9AA8B8;background:#121820;border-top:1px solid #2A364F}
        .post-media{width:100%;max-height:390px;object-fit:cover;border-radius:12px}
        .sample-tag{display:inline-block;font-size:9px;letter-spacing:.06em;color:#f4c76b;border:1px solid rgba(244,199,107,.35);border-radius:20px;padding:3px 7px}
        .feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
        .feature-tile{background:#1A2230;border:1px solid #2A364F;border-radius:14px;padding:13px}
        .story-avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid #19C7C7;padding:2px}

        .market-tools{display:grid;grid-template-columns:1fr 1fr;gap:9px}
        .market-control{width:100%;min-width:0;background:#121820;color:#F3F6FA;border:1px solid #2A364F;border-radius:12px;padding:11px 12px;font-size:12px}
        .market-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
        .market-card{background:#1A2230;border:1px solid #2A364F;border-radius:16px;overflow:hidden;min-width:0}
        .market-card img,.market-placeholder{width:100%;height:145px;object-fit:cover;background:#172333}
        .market-placeholder{display:flex;align-items:center;justify-content:center;font-size:46px}
        .market-pill{display:inline-flex;border:1px solid rgba(25,199,199,.3);background:rgba(25,199,199,.09);color:#8de5e5;border-radius:999px;padding:4px 8px;font-size:10px}
        .market-action{border-radius:10px;padding:9px 10px;font-size:11px;font-weight:700}
        .market-primary{background:#19C7C7;color:#061315}
        .market-secondary{background:#121820;color:#19C7C7;border:1px solid #2A364F}
        .modal-field{width:100%;background:#0A0E14;color:#F3F6FA;border:1px solid #2A364F;border-radius:11px;padding:11px 12px;font-size:13px;outline:none}
        .modal-field:focus{border-color:#19C7C7}
        .modal-label{display:block;color:#9AA8B8;font-size:11px;margin:2px 0 5px}
        .soft-note{border:1px solid rgba(244,199,107,.28);background:rgba(244,199,107,.07);color:#f0d59b;padding:11px;border-radius:12px;font-size:11px;line-height:1.5}
        @media(min-width:640px){.market-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.market-tools{grid-template-columns:2fr 1fr 1fr}}

        @media(min-width:768px){#app{max-width:900px!important}.feature-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

        // IndexedDB Offline Cache System Engine
        const DB_NAME = "NaxcivanGoyercinDB";
        let db;
        function initIndexedDB() {
            if (!window.indexedDB) return;
            try {
                const request=indexedDB.open(DB_NAME,1);
                request.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('posts'))d.createObjectStore('posts',{keyPath:'id'});if(!d.objectStoreNames.contains('pigeons'))d.createObjectStore('pigeons',{keyPath:'id'});};
                request.onsuccess=e=>{db=e.target.result;};
                request.onerror=()=>console.warn('IndexedDB açıla bilmədi; localStorage davam edir.');
            } catch(e) { console.warn('IndexedDB əlçatan deyil.',e); }
        }

                    ${media?`<img src="${esc(media)}" alt="Göyərçin paylaşımı" class="post-media" loading="lazy">`:''}

                        <button onclick="openComments(${jsArg(post.id)})"><i class="fa-regular fa-comment"></i> ${Number(post.comments)||0}</button>

        async function submitNewPost() {

            if(file){if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>1200000){showToast('Şəkil JPG, PNG və ya WEBP olmalı və 1.2 MB-dan kiçik olmalıdır.');return;}media=await readImageAsDataURL(file);}

            saveLocalState();closeModal();showToast('Paylaşım bu cihazda saxlanıldı.');openTab('feed');

            saveLocalState();closeModal();showToast('Göyərçin bu cihazda qeydə alındı.');openTab('pigeons');

        // FLIGHT TIMER STOPWATCH ENGINE
        let timerInterval;
        let timerSeconds = 0;
        function startFlightTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                timerSeconds++;
                const hrs = String(Math.floor(timerSeconds / 3600)).padStart(2, '0');
                const mins = String(Math.floor((timerSeconds % 3600) / 60)).padStart(2, '0');
                const secs = String(timerSeconds % 60).padStart(2, '0');
                const disp = document.getElementById('stopwatchDisplay');
                if(disp) disp.innerText = `${hrs}:${mins}:${secs}`;
            }, 1000);
            showToast("Uçuş saniyəölçəni başladı!");
        }
        function stopFlightTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            showToast("Uçuş saxlanıldı!");
        }
        function resetFlightTimer() {
            stopFlightTimer();
            timerSeconds = 0;
            const disp = document.getElementById('stopwatchDisplay');
            if(disp) disp.innerText = "00:00:00";
        }

        // DATA EXPORT FUNCTION
        function exportUserData(){try{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`naxcivan-goyercin-backup-${Date.now()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('JSON ehtiyat nüsxəsi yaradıldı.');}catch(e){showToast('İxrac mümkün olmadı.');}}

        // TOAST NOTIFICATION SYSTEM
        function showToast(msg) {
            const container=document.getElementById('toastContainer');if(!container){console.info(String(msg));return;}
            const toast=document.createElement('div');toast.className='bg-brand-turquoise text-black text-xs font-bold px-4 py-2.5 rounded-xl shadow-2xl transition transform duration-300 translate-y-2 opacity-0 flex items-center justify-between';
            const span=document.createElement('span');span.textContent=String(msg??'');toast.appendChild(span);container.appendChild(toast);
            requestAnimationFrame(()=>toast.classList.remove('translate-y-2','opacity-0'));setTimeout(()=>{toast.classList.add('opacity-0');setTimeout(()=>toast.remove(),300);},2500);
        }


        // Lokal yaddaş: bu cihazdan kənara məlumat göndərilmir.
        const STORAGE_KEY="ng_ultra_social_v3";
        function saveLocalState(){try{const d={};['posts','pigeons','marketplace','currentUser','cart','favorites','orders','inquiries','vetAppointments','vetProviders'].forEach(k=>d[k]=state[k]);localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return true;}catch(e){console.warn(e);showToast('Yaddaş dolu ola bilər. Şəkilləri kiçildin.');return false;}}
        function restoreLocalState(){try{const raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem('ng_ultra_social_v2');if(!raw)return;const d=JSON.parse(raw);['posts','pigeons','marketplace','cart','favorites','orders','inquiries','vetAppointments','vetProviders'].forEach(k=>{if(Array.isArray(d[k]))state[k]=d[k];});if(d.currentUser)state.currentUser={...state.currentUser,...d.currentUser};state.marketplace=state.marketplace.map(p=>({...p,category:p.category||inferMarketCategory(p),price:parsePrice(p.price),sample:p.sample!==false}));}catch(e){console.warn('Local data restore failed',e);}}
        function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
        function jsArg(v){return esc(JSON.stringify(String(v??'')));}
        function safeMediaUrl(v){const s=String(v||'');if(s.startsWith('https://')&&!/[ "'<>]/.test(s))return s;if(s.startsWith('data:image/')&&s.includes(';base64,')&&!/[ "'<>]/.test(s))return s;return '';}
        function readImageAsDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=reject;r.readAsDataURL(file);});}
        function parsePrice(v){if(typeof v==='number')return v;const n=Number(String(v||'').replace(',','.').replace(/[^0-9.]/g,''));return Number.isFinite(n)?n:0;}
        function formatPrice(v){const s=parsePrice(v).toFixed(2);return `${s.endsWith('.00')?s.slice(0,-3):s} AZN`;}
        function inferMarketCategory(p){const s=`${p.title||''} ${p.description||''}`.toLowerCase();if(/göyərçin|güvercin|guvercin|bala|takla|posta/.test(s))return'pigeon';if(/yem|dən|qidalan/.test(s))return'feed';if(/daşıma|qəfəs|transport/.test(s))return'transport';if(/gigiyena|təmizlik|qulluq/.test(s))return'care';if(/mineral|kalsium|vitamin|baytar/.test(s))return'vetcare';return'loft';}
        function getCategoryLabel(c){return({pigeon:'Göyərçin',feed:'Yem və qidalanma',loft:'Kümes və avadanlıq',transport:'Daşıma vasitələri',care:'Gigiyena və qulluq',vetcare:'Baytarlıq məhsulları'})[c]||'Göyərçin məhsulu';}
        function cartCount(){return state.cart.reduce((n,x)=>n+(Number(x.qty)||0),0);}
        function openSearch(){const q=prompt('Göyərçin, ring, məhsul və ya satıcı axtar:');if(!q||!q.trim())return;state.marketSearch=q.trim();state.marketCategory='all';openTab('market');}


        function renderMarketCard(p){const img=safeMediaUrl(p.img||p.image),fav=state.favorites.includes('product:'+p.id);return `<article class="market-card">${img?`<img src="${esc(img)}" alt="${esc(p.title)}" loading="lazy">`:`<div class="market-placeholder">${p.category==='pigeon'?'🕊️':p.category==='feed'?'🌾':p.category==='transport'?'📦':p.category==='care'?'🧼':p.category==='vetcare'?'🩺':'🏠'}</div>`}<div class="p-3 space-y-2"><div class="flex justify-between"><span class="market-pill">${esc(getCategoryLabel(p.category))}</span><button onclick="toggleProductFavorite(${jsArg(p.id)})" aria-label="Seçilənlərə əlavə et">${fav?'❤️':'♡'}</button></div><h3 class="font-bold text-xs min-h-[36px]">${esc(p.title)}</h3><div class="flex justify-between gap-2"><b class="text-brand-turquoise text-sm">${formatPrice(p.price)}</b><span class="text-[10px] text-brand-muted">${esc(p.location||'')}</span></div><p class="text-[10px] text-brand-muted">Satıcı: ${esc(p.seller||'İstifadəçi')}</p>${p.sample?'<span class="sample-tag">NÜMUNƏ</span>':'<span class="market-pill">Lokal elan</span>'}<div class="grid grid-cols-2 gap-2"><button class="market-action market-primary" onclick="addToCart(${jsArg(p.id)})">Səbətə at</button><button class="market-action market-secondary" onclick="openProductDetails(${jsArg(p.id)})">Ətraflı</button></div><button class="w-full text-[10px] text-brand-turquoise" onclick="openSellerContact(${jsArg(p.id)})">Satıcıya sorğu göndər</button></div></article>`;}
        function applyMarketSearch(){state.marketSearch=document.getElementById('marketSearchInput')?.value||'';renderMarketView(document.getElementById('mainViewport'));}
        function toggleProductFavorite(id){const k='product:'+id,i=state.favorites.indexOf(k);if(i>=0)state.favorites.splice(i,1);else state.favorites.push(k);saveLocalState();renderMarketView(document.getElementById('mainViewport'));}
        function togglePostBookmark(id){const k='post:'+id,i=state.favorites.indexOf(k);if(i>=0)state.favorites.splice(i,1);else state.favorites.push(k);saveLocalState();showToast(i>=0?'Yadda saxlanılanlardan çıxarıldı.':'Paylaşım yadda saxlandı.');}
        function addToCart(id){const p=state.marketplace.find(x=>x.id===id);if(!p)return;const x=state.cart.find(x=>x.productId===id);if(x)x.qty=Math.min(99,x.qty+1);else state.cart.push({productId:id,qty:1});saveLocalState();showToast('Məhsul səbətə əlavə edildi.');renderMarketView(document.getElementById('mainViewport'));}
        function openFavorites(){const items=state.marketplace.filter(p=>state.favorites.includes('product:'+p.id));document.getElementById('mainViewport').innerHTML=`<div class="p-4 space-y-3"><h2 class="font-bold">Seçilən məhsullar</h2><button onclick="openTab('market')" class="text-xs text-brand-turquoise">Bazara qayıt</button><div class="market-grid">${items.map(renderMarketCard).join('')||'<p class="text-xs text-brand-muted">Seçilmiş məhsul yoxdur.</p>'}</div></div>`;}
        function openCustomModal(markup){document.getElementById('modalContainer').innerHTML=markup;document.getElementById('modalOverlay').classList.remove('hidden');}
        function openProductDetails(id){const p=state.marketplace.find(x=>x.id===id);if(!p)return;openCustomModal(`<div class="p-4 space-y-3"><div class="flex justify-between"><h3 class="font-bold">Məhsul məlumatı</h3><button onclick="closeModal()">✕</button></div>${safeMediaUrl(p.img)?`<img src="${esc(safeMediaUrl(p.img))}" class="w-full max-h-48 object-cover rounded-xl">`:'<div class="market-placeholder rounded-xl">🕊️</div>'}<b class="text-sm">${esc(p.title)}</b><strong class="block text-brand-turquoise">${formatPrice(p.price)}</strong><p class="text-xs text-brand-muted whitespace-pre-wrap">${esc(p.description)}</p><p class="text-xs">${esc(p.seller)} · ${esc(p.location)}</p><button onclick="addToCart(${jsArg(p.id)});closeModal()" class="market-action market-primary w-full">Səbətə əlavə et</button></div>`);}
        function openCartModal(){const rows=state.cart.map(x=>({x,p:state.marketplace.find(p=>p.id===x.productId)})).filter(x=>x.p),sum=rows.reduce((s,x)=>s+x.p.price*x.x.qty,0);openCustomModal(`<div class="p-4 space-y-3"><div class="flex justify-between"><h3 class="font-bold">Alış-veriş səbəti</h3><button onclick="closeModal()">✕</button></div>${rows.map(x=>`<div class="flex justify-between gap-2 border-b border-brand-border/40 pb-2"><div class="min-w-0"><b class="text-xs">${esc(x.p.title)}</b><p class="text-xs text-brand-turquoise">${formatPrice(x.p.price)} × ${x.x.qty}</p></div><div class="flex gap-1"><button class="market-action market-secondary" onclick="changeCartQty(${jsArg(x.p.id)},-1)">−</button><button class="market-action market-secondary" onclick="changeCartQty(${jsArg(x.p.id)},1)">+</button><button class="market-action market-secondary" onclick="removeFromCart(${jsArg(x.p.id)})">Sil</button></div></div>`).join('')||'<p class="text-xs text-brand-muted">Səbət boşdur.</p>'}<div class="flex justify-between font-bold"><span>Cəmi</span><span class="text-brand-turquoise">${formatPrice(sum)}</span></div><button ${rows.length?'':'disabled'} onclick="openCheckoutModal()" class="market-action market-primary w-full">Sifariş sorğusu yarat</button><p class="text-[10px] text-brand-muted">Ödəniş edilmir və sorğu satıcıya göndərilmir.</p></div>`);}
        function changeCartQty(id,d){const x=state.cart.find(x=>x.productId===id);if(!x)return;x.qty=Math.max(1,Math.min(99,x.qty+d));saveLocalState();openCartModal();}
        function removeFromCart(id){state.cart=state.cart.filter(x=>x.productId!==id);saveLocalState();openCartModal();}
        function openOrdersModal(){const rows=state.orders.slice().reverse();openCustomModal(`<div class="p-4 space-y-3"><div class="flex justify-between"><h3 class="font-bold">Sifariş sorğularım</h3><button onclick="closeModal()">✕</button></div>${rows.map(o=>`<div class="feature-tile"><b class="text-xs">${esc(o.id)}</b><p class="text-xs text-brand-muted">${esc(o.createdAt)} · ${formatPrice(o.total)}</p><p class="text-[10px] text-brand-muted">${o.items.length} məhsul · ${esc(o.status)}</p></div>`).join('')||'<p class="text-xs text-brand-muted">Hələ sifariş sorğusu yoxdur.</p>'}<p class="text-[10px] text-brand-muted">Bunlar yalnız bu cihazda saxlanmış qeydlərdir; satıcıya göndərilməyib.</p></div>`);}
        function openCheckoutModal(){if(!cartCount()){showToast('Səbət boşdur.');return;}openCustomModal(`<form class="p-4 space-y-3" onsubmit="event.preventDefault();submitCheckout()"><div class="flex justify-between"><h3 class="font-bold">Sifariş məlumatı</h3><button type="button" onclick="closeModal()">✕</button></div><label class="modal-label">Ad və soyad</label><input id="coName" class="modal-field" required maxlength="80"><label class="modal-label">Telefon</label><input id="coPhone" class="modal-field" type="tel" required maxlength="30"><label class="modal-label">Şəhər / rayon və ünvan</label><textarea id="coAddress" class="modal-field" required maxlength="300"></textarea><button class="market-action market-primary w-full">Sorğunu bu cihazda saxla</button><p class="text-[10px] text-brand-muted">Real sifariş, ödəniş və çatdırılma üçün server və satıcı inteqrasiyası lazımdır.</p></form>`);}
        function submitCheckout(){const name=document.getElementById('coName').value.trim(),phone=document.getElementById('coPhone').value.trim(),address=document.getElementById('coAddress').value.trim();if(!name||!phone||!address){showToast('Məlumatları doldurun.');return;}const items=state.cart.map(x=>({productId:x.productId,qty:x.qty})),total=items.reduce((s,x)=>s+state.marketplace.find(p=>p.id===x.productId).price*x.qty,0);state.orders.push({id:'ord_'+Date.now(),name,phone,address,items,total,createdAt:new Date().toLocaleString(),status:'Lokal qeyd'});state.cart=[];saveLocalState();closeModal();showToast('Sifariş sorğusu bu cihazda saxlanıldı.');openTab('market');}
        function openSellerContact(id){const p=state.marketplace.find(x=>x.id===id);if(!p)return;openCustomModal(`<form class="p-4 space-y-3" onsubmit="event.preventDefault();submitSellerContact(${jsArg(id)})"><div class="flex justify-between"><h3 class="font-bold">Satıcıya sorğu</h3><button type="button" onclick="closeModal()">✕</button></div><p class="text-xs text-brand-muted">${esc(p.title)} · ${esc(p.seller)}</p><label class="modal-label">Adınız</label><input id="scName" class="modal-field" required maxlength="80"><label class="modal-label">Telefon</label><input id="scPhone" class="modal-field" required maxlength="30"><label class="modal-label">Mesaj</label><textarea id="scMsg" class="modal-field" required maxlength="500">Salam. Elanınızla maraqlanıram.</textarea><button class="market-action market-primary w-full">Sorğunu lokal saxla</button><p class="text-[10px] text-brand-muted">Satıcıya göndərilmir; yalnız bu cihazda saxlanılır.</p></form>`);}
        function submitSellerContact(id){const p=state.marketplace.find(x=>x.id===id);if(!p)return;const name=document.getElementById('scName').value.trim(),phone=document.getElementById('scPhone').value.trim(),message=document.getElementById('scMsg').value.trim();if(!name||!phone||!message)return;state.inquiries.push({id:'inq_'+Date.now(),seller:p.seller,name,phone,message,createdAt:new Date().toLocaleString()});saveLocalState();closeModal();showToast('Sorğu lokal yaddaşa yazıldı.');}
        function openListingModal(){openCustomModal(`<form class="p-4 space-y-3 max-h-[85vh] overflow-y-auto" onsubmit="event.preventDefault();submitListing()"><div class="flex justify-between"><h3 class="font-bold">Yeni elan yerləşdir</h3><button type="button" onclick="closeModal()">✕</button></div><label class="modal-label">Kateqoriya</label><select id="liCategory" class="modal-field"><option value="pigeon">Göyərçin satışı</option><option value="feed">Yem və qidalanma</option><option value="loft">Kümes və avadanlıq</option><option value="transport">Daşıma vasitələri</option><option value="care">Gigiyena və qulluq</option><option value="vetcare">Baytarlıq məhsulları (qida əlavələri və qulluq)</option></select><label class="modal-label">Elanın adı</label><input id="liTitle" class="modal-field" required maxlength="100"><label class="modal-label">Qiymət (AZN)</label><input id="liPrice" class="modal-field" type="number" min="0.01" max="1000000" step="0.01" required><label class="modal-label">Şəhər / rayon</label><input id="liLocation" class="modal-field" required maxlength="80"><label class="modal-label">Təsvir</label><textarea id="liDescription" class="modal-field" rows="3" required maxlength="1000"></textarea><label class="modal-label">Şəkil (JPG/PNG/WEBP, max 1.2 MB)</label><input id="liImage" type="file" accept="image/jpeg,image/png,image/webp" class="w-full text-xs"><button class="market-action market-primary w-full">Elanı bu cihazda yarat</button><p class="text-[10px] text-brand-muted">Reseptli dərman, antibiotik və vaksinlər adi elan kimi satıla bilməz; qanuni satış və lisenziya yoxlaması serverdə tətbiq edilməlidir.</p></form>`);}
        async function submitListing(){const title=document.getElementById('liTitle').value.trim(),category=document.getElementById('liCategory').value,price=Number(document.getElementById('liPrice').value),location=document.getElementById('liLocation').value.trim(),description=document.getElementById('liDescription').value.trim(),file=document.getElementById('liImage').files[0];if(!title||!location||!description||!Number.isFinite(price)||price<=0){showToast('Elan məlumatlarını düzgün doldurun.');return;}if(file&&(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size>1200000)){showToast('Şəkil formatı uyğun deyil və ya fayl böyükdür.');return;}const img=file?await readImageAsDataURL(file):'';state.marketplace.unshift({id:'mk_'+Date.now(),title,category,price,seller:state.currentUser.name,location,description,img,sample:false,createdAt:Date.now()});saveLocalState();closeModal();state.marketCategory='all';state.marketSearch='';showToast('Elan bu cihazda yaradıldı.');openTab('market');}
        function renderVetsView(container){container.innerHTML=`<div class="p-4 space-y-4"><h2 class="font-bold text-lg text-brand-turquoise"><i class="fa-solid fa-user-doctor"></i> Göyərçinlər üçün baytarlıq xidmətləri</h2><p class="text-xs text-brand-muted">Klinik müayinə, evdə baxış, laborator analiz yönləndirməsi və profilaktik məsləhət.</p><div class="soft-note"><b>Sağlamlıq qaydası:</b> Xəstə quşu mümkün olduqda ayırın və baytarla əlaqə saxlayın. Antibiotik, vaksin və parazit dərmanının növünü/dozasını özbaşına seçməyin. Bu platforma diaqnoz vermir.</div><div class="feature-grid"><div class="feature-tile"><b class="text-brand-turquoise">Klinik müayinə</b><p class="text-xs text-brand-muted">Ümumi vəziyyət və fiziki baxış.</p></div><div class="feature-tile"><b class="text-brand-turquoise">Evdə baxış</b><p class="text-xs text-brand-muted">Kümes şəraitində müayinə sorğusu.</p></div><div class="feature-tile"><b class="text-brand-turquoise">Laborator analiz</b><p class="text-xs text-brand-muted">Baytar göstərişi ilə analiz.</p></div></div><button onclick="openVetRequestModal()" class="market-action market-primary w-full">Baytar müayinəsi üçün müraciət</button><button onclick="openVetProviderModal()" class="market-action market-secondary w-full">Baytar / klinika qeydiyyatı</button><h3 class="font-bold text-sm">Müraciətlərim (${state.vetAppointments.length})</h3>${state.vetAppointments.slice().reverse().map(x=>`<div class="feature-tile"><b>${esc(x.service)}</b><p class="text-xs text-brand-muted">${esc(x.city)} · ${esc(x.phone)}</p><p class="text-xs">${esc(x.notes)}</p><span class="sample-tag">LOKAL QEYD</span></div>`).join('')||'<p class="text-xs text-brand-muted">Hələ müraciət yoxdur.</p>'}<h3 class="font-bold text-sm">Baytar qeydiyyat sorğuları (${state.vetProviders.length})</h3>${state.vetProviders.map(x=>`<div class="feature-tile"><b>${esc(x.clinic)}</b><p class="text-xs text-brand-muted">${esc(x.city)} · ${esc(x.license)}</p><span class="sample-tag">TƏSDİQ GÖZLƏYİR</span></div>`).join('')||'<p class="text-xs text-brand-muted">Qeydiyyat sorğusu yoxdur.</p>'}</div>`;}
        function openVetRequestModal(){openCustomModal(`<form class="p-4 space-y-3 max-h-[85vh] overflow-y-auto" onsubmit="event.preventDefault();submitVetRequest()"><div class="flex justify-between"><h3 class="font-bold">Baytar müayinəsi sorğusu</h3><button type="button" onclick="closeModal()">✕</button></div><label class="modal-label">Xidmət</label><select id="vsType" class="modal-field"><option>Klinik müayinə</option><option>Evdə baxış</option><option>Laborator analiz yönləndirməsi</option><option>Qidalanma və profilaktika məsləhəti</option></select><label class="modal-label">Ring nömrəsi (varsa)</label><input id="vsRing" class="modal-field" maxlength="40"><label class="modal-label">Şəhər / rayon</label><input id="vsCity" class="modal-field" required maxlength="80"><label class="modal-label">Telefon</label><input id="vsPhone" class="modal-field" type="tel" required maxlength="30"><label class="modal-label">Əlamətlər / müraciət səbəbi</label><textarea id="vsNotes" class="modal-field" required maxlength="1000" rows="4"></textarea><button class="market-action market-primary w-full">Sorğunu bu cihazda saxla</button><p class="text-[10px] text-brand-muted">Bu sorğu klinikaya göndərilmir. Təcili vəziyyətdə ən yaxın real baytar klinikasına müraciət edin.</p></form>`);}
        function submitVetRequest(){const service=document.getElementById('vsType').value,ring=document.getElementById('vsRing').value.trim(),city=document.getElementById('vsCity').value.trim(),phone=document.getElementById('vsPhone').value.trim(),notes=document.getElementById('vsNotes').value.trim();if(!city||!phone||!notes){showToast('Şəhər, telefon və səbəb vacibdir.');return;}state.vetAppointments.push({id:'vet_'+Date.now(),service,ring,city,phone,notes,createdAt:new Date().toLocaleString()});saveLocalState();closeModal();showToast('Müraciət cihazda saxlanıldı, klinikaya göndərilmədi.');openTab('vets');}
        function openVetProviderModal(){openCustomModal(`<form class="p-4 space-y-3 max-h-[85vh] overflow-y-auto" onsubmit="event.preventDefault();submitVetProvider()"><div class="flex justify-between"><h3 class="font-bold">Baytar / klinika qeydiyyatı</h3><button type="button" onclick="closeModal()">✕</button></div><label class="modal-label">Klinika adı</label><input id="vpClinic" class="modal-field" required maxlength="100"><label class="modal-label">Baytarın adı</label><input id="vpName" class="modal-field" required maxlength="80"><label class="modal-label">Lisenziya / qeydiyyat nömrəsi</label><input id="vpLicense" class="modal-field" required maxlength="80"><label class="modal-label">Şəhər / rayon</label><input id="vpCity" class="modal-field" required maxlength="80"><label class="modal-label">Telefon</label><input id="vpPhone" class="modal-field" required maxlength="30"><button class="market-action market-primary w-full">Yoxlama üçün sorğu yarat</button><p class="text-[10px] text-brand-muted">Bu prototipdə sənədlər yoxlanmır; xidmət təsdiqlənmiş kimi göstərilmir.</p></form>`);}
        function submitVetProvider(){const clinic=document.getElementById('vpClinic').value.trim(),name=document.getElementById('vpName').value.trim(),license=document.getElementById('vpLicense').value.trim(),city=document.getElementById('vpCity').value.trim(),phone=document.getElementById('vpPhone').value.trim();if(!clinic||!name||!license||!city||!phone)return;state.vetProviders.push({id:'vp_'+Date.now(),clinic,name,license,city,phone,status:'pending'});saveLocalState();closeModal();showToast('Qeydiyyat sorğusu cihazda saxlanıldı.');openTab('vets');}
        function openComments(id){const p=state.posts.find(x=>x.id===id);if(!p)return;const c=prompt('Şərhinizi yazın:');if(!c||!c.trim())return;p.comments=(Number(p.comments)||0)+1;state.inquiries.push({id:'comment_'+Date.now(),seller:p.author?.name||'İstifadəçi',message:c.trim(),createdAt:new Date().toLocaleString()});saveLocalState();showToast('Şərh lokal olaraq qeydə alındı.');openTab('feed');}
        async function sharePost(id){const p=state.posts.find(x=>x.id===id);if(!p)return;const text=`${p.author?.name||'Göyərçin icması'}: ${p.content||''}`;try{if(navigator.share)await navigator.share({title:'Naxçıvan Göyərçin',text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);showToast('Mətn kopyalandı.');}else showToast('Paylaşım bu brauzerdə dəstəklənmir.');p.shares=(Number(p.shares)||0)+1;saveLocalState();}catch(e){if(e.name!=='AbortError')showToast('Paylaşım mümkün olmadı.');}}
        function clearLocalCache(){if(!confirm('Bu cihazda saxlanmış platforma məlumatları silinsin?'))return;localStorage.removeItem(STORAGE_KEY);showToast('Lokal məlumatlar silindi; səhifəni yeniləyin.');}

        function renderExploreView(container){ container.innerHTML=`<div class="p-4 space-y-4"><h2 class="font-bold text-lg text-brand-turquoise">Kəşfet · Göyərçin dünyası</h2><div class="feature-grid">${[['#NaxçıvanAğbaş','Naxçıvan ağbaş göyərçinləri'],['#Takla','Takla uçuş müşahidələri'],['#PostaGöyərçini','Posta göyərçinləri'],['#Damazlıq','Damazlıq və soy ağacı'],['#Kümes','Kümes baxımı'],['#Yarış','Uçuş yarışları']].map(x=>`<div class="feature-tile"><b class="text-brand-turquoise">${x[0]}</b><p class="text-xs text-brand-muted mt-2">${x[1]}</p></div>`).join('')}</div><p class="text-xs text-brand-muted">Bu mövzu kartları platformanın demo kəşfet menyusudur.</p></div>`; }
        function renderGroupsView(container){ container.innerHTML=`<div class="p-4 space-y-3"><h2 class="font-bold text-lg">İcmalar və klublar</h2>${[['Naxçıvan Göyərçin Klubu','Regional görüşlər, qaydalar və elanlar'],['Takla Yetişdiriciləri','Uçuş texnikası və müşahidə qeydləri'],['Posta Göyərçinləri','İstiqamət, məşq və sağlamlıq qeydləri'],['Damazlıq və Genetika','Soy ağacı, ring və cins standartları']].map(x=>`<div class="feature-tile"><b>${x[0]}</b><p class="text-xs text-brand-muted mt-1">${x[1]}</p><button class="mt-3 text-xs text-brand-turquoise" onclick="showToast('Demo icma: server bağlantısı tələb olunur')">İcmaya bax</button></div>`).join('')}</div>`; }
        function openTab(tabName){ state.activeTab=tabName; document.querySelectorAll('.nav-btn').forEach(btn=>{if(btn.dataset.tab===tabName){btn.classList.add('text-brand-turquoise');btn.classList.remove('text-brand-muted')}else{btn.classList.remove('text-brand-turquoise');btn.classList.add('text-brand-muted')}}); const viewport=document.getElementById('mainViewport'); switch(tabName){case 'feed':renderFeedView(viewport);break;case 'reels':renderReelsView(viewport);break;case 'pigeons':renderPigeonsView(viewport);break;case 'messages':renderMessagesView(viewport);break;case 'notifications':renderNotificationsView(viewport);break;case 'profile':renderProfileView(viewport);break;case 'admin':renderAdminView(viewport);break;case 'market':renderMarketView(viewport);break;case 'vets':renderVetsView(viewport);break;case 'explore':renderExploreView(viewport);break;case 'groups':renderGroupsView(viewport);break;default:renderFeedView(viewport)} }

        // INITIALIZATION ON LOAD
        window.addEventListener('load',function(){initIndexedDB();restoreLocalState();try{if(localStorage.getItem('ng_theme')==='light'){document.documentElement.classList.remove('dark');document.documentElement.classList.add('light');}}catch(e){}openTab('feed');});
    </script>
